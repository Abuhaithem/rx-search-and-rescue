# Production compose for the single-EC2 deployment. Run from deploy/:
#   docker compose up -d --build
# Reads ../.env (RDS, S3, Redis, extraction provider). Only Caddy is exposed;
# web/worker/redis stay on the internal network.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # rds-global-bundle.pem (RDS CA, public) must sit next to this file:
  #   curl -o rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
  # NODE_EXTRA_CA_CERTS makes Node trust it, so DATABASE_URL can use
  # sslmode=verify-full (verified TLS, not just encrypted).
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/rds-global-bundle.pem
    volumes:
      - ./rds-global-bundle.pem:/etc/ssl/certs/rds-global-bundle.pem:ro
    expose:
      - "3000"
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/rds-global-bundle.pem
    volumes:
      - ./rds-global-bundle.pem:/etc/ssl/certs/rds-global-bundle.pem:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queue payloads are job IDs only (no PHI); persistence just lets in-flight
    # ingestions survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data:
